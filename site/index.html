<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1119">
<meta name="robots" content="noindex,nofollow">
<title>MyBit</title>
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("mybit_theme"))||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/"><span class="brand-dot" id="brandDot"></span>MyBit</a>
    <span class="upd" id="upd" aria-live="polite"></span>
    <div class="ticker" id="ticker" aria-label="Giá chính"></div>
    <div class="search">
      <input id="q" type="search" placeholder="Tìm coin, ví dụ SOL" autocomplete="off" aria-label="Tìm coin">
      <div class="sugg" id="sugg" hidden></div>
    </div>
    <button class="iconbtn" id="theme" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<nav class="tabs" id="tabs">
  <a href="#/" data-r="market"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>Thị trường</a>
  <a href="#/coins" data-r="coins"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 8h4.5a2 2 0 0 1 0 4H9h5a2 2 0 0 1 0 4H9zM11 6v2M11 16v2"/></svg>Coin</a>
  <a href="#/ideas" data-r="ideas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Cơ hội</a>
  <a href="#/futures" data-r="futures"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Futures</a>
  <a href="#/portfolio" data-r="portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Danh mục</a>
  <a href="#/tools" data-r="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h4"/></svg>Công cụ</a>
  <a href="#/backtest" data-r="backtest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>Kiểm chứng</a>
</nav>
<main id="app" tabindex="-1"><p class="muted">Đang tải…</p></main>
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="app.js"></script>
</body>
</html>

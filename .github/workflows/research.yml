name: Nghiên cứu phương pháp bot lướt giây

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Tệp nghiên cứu trong research/"
        default: "events.py"
      nsym:
        description: "Số mã futures (khối lượng lớn nhất)"
        default: "220"
      env:
        description: "Biến môi trường thêm, dạng KEY=VAL;KEY=VAL"
        default: ""

permissions:
  contents: write

env:
  STATUS_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
  STATUS_SSH_KEY: ${{ secrets.STATUS_SSH_KEY }}      # có thì báo cáo vào repo riêng tư bot-status (xem scripts/publish_status.sh)

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Bộ đệm dữ liệu nến
        uses: actions/cache@v4
        with:
          path: rs_cache
          key: rs-${{ github.run_id }}
          restore-keys: rs-
      - name: Chạy nghiên cứu
        env:
          RS_NSYM: ${{ inputs.nsym }}
        run: |
          IFS=';' read -ra KV <<< "${{ inputs.env }}"; for kv in "${KV[@]}"; do [ -n "$kv" ] && export "$kv"; done
          mkdir -p research_out && (python research/${{ inputs.script }} 2>&1 | tail -c 400000 > research_out/stdout.txt) ; tail -60 research_out/stdout.txt
      - name: Đẩy kết quả lên nhánh status
        if: always()
        run: bash scripts/publish_status.sh research research_out
      - name: Lưu kết quả thành artifact (phòng khi nhánh status bị lần chạy khác ghi đè cùng lúc)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research_out
          path: research_out
          retention-days: 14
